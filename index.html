<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Buildscape</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        input { padding: 8px; font-size: 16px; }
        button { padding: 8px 12px; font-size: 16px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
<script>
    // --- Check if user is logged in ---
    let user = JSON.parse(localStorage.getItem('user'));

    if(user) {
        showDashboard(user);
    } else {
        showLoginForm();
    }

    // --- Signup function ---
    function signup(username) {
        if(!username) { alert("Enter a username"); return; }
        const badge = "🌟";
        const newUser = { username, badge, lastLogin: null };
        localStorage.setItem('user', JSON.stringify(newUser));
        showDashboard(newUser);
    }

    // --- Login function ---
    function login(username) {
        const storedUser = JSON.parse(localStorage.getItem('user'));
        if(storedUser && storedUser.username === username){
            showDashboard(storedUser);
        } else {
            alert("User not found. Please sign up.");
        }
    }

    // --- Dashboard display ---
    function showDashboard(user){
        const today = new Date().toDateString();
        let message;

        if(user.lastLogin !== today){
            const horoscopes = [
                "You will have a lucky day!",
                "New opportunities are coming your way.",
                "Today is perfect for creativity.",
                "Your energy will attract good things!"
            ];
            message = horoscopes[Math.floor(Math.random() * horoscopes.length)];
            user.lastLogin = today;
            localStorage.setItem('user', JSON.stringify(user));
        } else {
            message = "Positive affirmation: You are amazing today!";
        }

        document.body.innerHTML = `
            <h2>Welcome, ${user.username}! ${user.badge}</h2>
            <p>${message}</p>
            <button onclick="proceed()">Go to Level Up</button>
            <br><br>
            <button onclick="logout()">Logout</button>
        `;
    }

    function logout(){
        localStorage.removeItem('user');
        location.reload();
    }

    // --- Show signup/login form ---
    function showLoginForm(){
        document.body.innerHTML = `
            <h2>Sign Up / Login</h2>
            <input id="username" placeholder="Enter username" />
            <br>
            <button onclick="signup(document.getElementById('username').value)">Sign Up</button>
            <button onclick="login(document.getElementById('username').value)">Login</button>
        `;
    }

    // --- Proceed to your Level Up page ---
    function proceed(){
        document.body.innerHTML = `
            <h1>Level Up!</h1>
            <p>This is your Buildscape page. 🎮</p>
            <button onclick="location.reload()">Back to Dashboard</button>
        `;
    }
</script>
</body>
</html>
