<div class="container" id="chatContainer">
  <h2>Community Chat</h2>
  <div id="chatMessages" style="height:200px; overflow-y:auto; border:1px solid #ccc; padding:10px; border-radius:8px; background:#fafafa;"></div>
  <input type="text" id="chatInput" placeholder="Write a message..." style="width:80%; padding:8px; margin-top:5px;">
  <button style="width:18%; padding:8px; margin-left:2%;" onclick="sendChat()">Send</button>
</div>

<script>
let chat = JSON.parse(localStorage.getItem('chat')) || [];

function renderChat() {
  const container = document.getElementById('chatMessages');
  container.innerHTML = chat.map(c=>`<div><strong>${c.username}:</strong> ${c.text}</div>`).join('');
  container.scrollTop = container.scrollHeight; // auto scroll to bottom
}

function sendChat() {
  const text = document.getElementById('chatInput').value.trim();
  if(!text || !currentUser) return;
  chat.push({ username: currentUser, text });
  localStorage.setItem('chat', JSON.stringify(chat));
  document.getElementById('chatInput').value = '';
  renderChat();
}

// auto-render chat on load
renderChat();
</script>
