<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buildscape</title>
<style>
  body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
  h1, h2 { text-align: center; color: #333; }
  .container { max-width: 600px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  input, textarea, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; }
  button { background: #4CAF50; color: #fff; border: none; cursor: pointer; }
  button:hover { background: #45a049; }
  .idea { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
  .votes { font-weight: bold; color: #333; }
  .level { color: #ff9800; font-weight: bold; }
  .hidden { display: none; }
</style>
</head>
<body>

<h1>Buildscape</h1>

<div class="container" id="authContainer">
  <h2>Sign Up / Login</h2>
  <input type="text" id="authUsername" placeholder="Username">
  <input type="password" id="authPassword" placeholder="Password">
  <button onclick="signUp()">Sign Up</button>
  <button onclick="login()">Login</button>
</div>

<div class="container hidden" id="ideaContainer">
  <h2>Submit Your Idea</h2>
  <textarea id="ideaText" rows="3" placeholder="Describe your idea..."></textarea>
  <button onclick="submitIdea()">Submit Idea</button>
</div>

<div class="container hidden" id="ideasListContainer">
  <h2>Ideas & Votes</h2>
  <div id="ideasContainer"></div>
</div>

<div class="container hidden" id="leaderboardContainer">
  <h2>Leaderboard</h2>
  <div id="leaderboard"></div>
</div>

<script>
// ---------- USERS ----------
let users = JSON.parse(localStorage.getItem('users')) || [];
let currentUser = localStorage.getItem('currentUser') || null;

// ---------- IDEAS ----------
let ideas = JSON.parse(localStorage.getItem('ideas')) || [];

// ---------- AUTH ----------
function signUp() {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value.trim();
  if (!username || !password) { alert('Enter username and password'); return; }

  if (users.find(u => u.username === username)) { alert('Username exists!'); return; }

  users.push({ username, password: btoa(password), points: 0 });
  localStorage.setItem('users', JSON.stringify(users));
  alert('Signed up! You can now login.');
}

function login() {
  const username = document.getElementById('authUsername').value.trim();
  const password = document.getElementById('authPassword').value.trim();
  const user = users.find(u => u.username === username && u.password === btoa(password));
  if (!user) { alert('Invalid username or password'); return; }

  currentUser = username;
  localStorage.setItem('currentUser', currentUser);
  alert('Logged in as ' + currentUser);
  document.getElementById('authContainer').classList.add('hidden');
  document.getElementById('ideaContainer').classList.remove('hidden');
  document.getElementById('ideasListContainer').classList.remove('hidden');
  document.getElementById('leaderboardContainer').classList.remove('hidden');
  renderIdeas();
  renderLeaderboard();
}

// ---------- IDEA SUBMISSION ----------
function saveIdeas() { localStorage.setItem('ideas', JSON.stringify(ideas)); }

function submitIdea() {
  if (!currentUser) { alert('Login first'); return; }
  const text = document.getElementById('ideaText').value.trim();
  if (!text) { alert('Enter an idea'); return; }

  ideas.push({ id: Date.now(), username: currentUser, text, votes: 0, votedBy: [] });
  saveIdeas();
  document.getElementById('ideaText').value = '';
  renderIdeas();
  renderLeaderboard();
}

// ---------- VOTING ----------
function vote(id) {
  if (!currentUser) { alert('Login first'); return; }
  const idea = ideas.find(i => i.id === id);
  if (idea.votedBy.includes(currentUser)) { alert('You already voted on this idea!'); return; }

  idea.votes++;
  idea.votedBy.push(currentUser);
  saveIdeas();

  // give points to idea owner
  const owner = users.find(u => u.username === idea.username);
  if (owner) { owner.points++; localStorage.setItem('users', JSON.stringify(users)); }

  renderIdeas();
  renderLeaderboard();
}

// ---------- LEVEL CALC ----------
function calculateLevel(points) {
  if (points >= 20) return 'Master';
  if (points >= 10) return 'Pro';
  if (points >= 5) return 'Intermediate';
  return 'Beginner';
}

// ---------- RENDER ----------
function renderIdeas() {
  const container = document.getElementById('ideasContainer');
  container.innerHTML = '';
  ideas.sort((a,b) => b.votes - a.votes);
  ideas.forEach(i => {
    const div = document.createElement('div');
    div.className = 'idea';
    div.innerHTML = `
      <div><strong>${i.username}</strong> (<span class="level">${calculateLevel(users.find(u => u.username===i.username)?.points || 0)}</span>): ${i.text}</div>
      <div><span class="votes">${i.votes} 👍</span>
      <button onclick="vote(${i.id})">Vote</button></div>
    `;
    container.appendChild(div);
  });
}

function renderLeaderboard() {
  const container = document.getElementById('leaderboard');
  container.innerHTML = '';
  const sorted = [...users].sort((a,b) => b.points - a.points);
  sorted.forEach(u => {
    const div = document.createElement('div');
    div.innerHTML = `<strong>${u.username}</strong> - ${u.points} pts (<span class="level">${calculateLevel(u.points)}</span>)`;
    container.appendChild(div);
  });
}

// ---------- AUTO LOGIN ----------
if (currentUser) {
  document.getElementById('authContainer').classList.add('hidden');
  document.getElementById('ideaContainer').classList.remove('hidden');
  document.getElementById('ideasListContainer').classList.remove('hidden');
  document.getElementById('leaderboardContainer').classList.remove('hidden');
  renderIdeas();
  renderLeaderboard();
}
</script>

</body>
</html>
