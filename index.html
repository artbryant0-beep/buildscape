<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Buildscape</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 40px;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      max-width: 400px;
      margin: auto;
    }
    .badge {
      font-size: 24px;
      margin: 10px 0;
    }
    button {
      background: #22c55e;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🌌 Buildscape</h1>

  <div class="card">
    <h2 id="username">Welcome, Builder</h2>
    
    <div class="badge" id="badge">Level 1 🟢</div>

    <p id="message">Your journey begins. Stay consistent.</p>

    <button onclick="levelUp()">Level Up</button>
  </div>

  <script>
    let level = localStorage.getItem("level") || 1;

    function updateUI() {
      document.getElementById("badge").innerText = "Level " + level + " 🔥";
      
      const messages = [
        "Consistency builds greatness.",
        "You're ahead of most people.",
        "Keep going. You're building something real.",
        "Small steps = big future.",
        "Discipline beats motivation."
      ];

      document.getElementById("message").innerText =
        messages[Math.floor(Math.random() * messages.length)];
    }

    function levelUp() {
      level++;
      localStorage.setItem("level", level);
      updateUI();
    }

    updateUI();
  </script>

</body>
</html>
