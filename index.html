<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buildscape</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
    h1 { text-align: center; color: #333; }
    .idea-form, .idea-list { max-width: 600px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input, textarea { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; }
    button { padding: 10px 20px; border: none; border-radius: 8px; background: #4CAF50; color: #fff; cursor: pointer; }
    button:hover { background: #45a049; }
    .idea { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
    .votes { font-weight: bold; color: #333; }
    .level { color: #ff9800; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Buildscape - Share & Vote Ideas</h1>

  <div class="idea-form">
    <h2>Submit Your Idea</h2>
    <input type="text" id="username" placeholder="Your Name">
    <textarea id="ideaText" rows="3" placeholder="Describe your idea..."></textarea>
    <button onclick="submitIdea()">Submit Idea</button>
  </div>

  <div class="idea-list">
    <h2>Ideas & Votes</h2>
    <div id="ideasContainer"></div>
  </div>

  <script>
    let ideas = JSON.parse(localStorage.getItem('ideas')) || [];

    function saveIdeas() {
      localStorage.setItem('ideas', JSON.stringify(ideas));
    }

    function submitIdea() {
      const username = document.getElementById('username').value.trim();
      const ideaText = document.getElementById('ideaText').value.trim();
      if (!username || !ideaText) {
        alert('Please enter your name and idea.');
        return;
      }

      const newIdea = {
        id: Date.now(),
        username: username,
        text: ideaText,
        votes: 0,
        voters: [] // track who voted
      };
      ideas.push(newIdea);
      saveIdeas();
      renderIdeas();
      document.getElementById('ideaText').value = '';
    }

    function vote(id, voter) {
      const idea = ideas.find(i => i.id === id);
      if (!idea.voters.includes(voter)) {
        idea.votes++;
        idea.voters.push(voter);
        saveIdeas();
        renderIdeas();
      } else {
        alert('You can only vote once per idea!');
      }
    }

    function calculateLevel(votes) {
      if (votes >= 20) return 'Master';
      if (votes >= 10) return 'Pro';
      if (votes >= 5) return 'Intermediate';
      return 'Beginner';
    }

    function renderIdeas() {
      const container = document.getElementById('ideasContainer');
      container.innerHTML = '';
      ideas.sort((a,b) => b.votes - a.votes); // sort by votes

      ideas.forEach(idea => {
        const ideaDiv = document.createElement('div');
        ideaDiv.className = 'idea';
        ideaDiv.innerHTML = `
          <div>
            <strong>${idea.username}</strong> (<span class="level">${calculateLevel(idea.votes)}</span>): ${idea.text}
          </div>
          <div>
            <span class="votes">${idea.votes} 👍</span>
            <button onclick="vote(${idea.id}, prompt('Enter your name to vote:'))">Vote</button>
          </div>
        `;
        container.appendChild(ideaDiv);
      });
    }

    renderIdeas();
  </script>

</body>
</html>
